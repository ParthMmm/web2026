[package]
name = "photo-contract-client"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
exclude = ["generated"]

[dependencies]
anyhow = "=1.0.102"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
