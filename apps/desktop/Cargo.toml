[package]
name = "photo-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
desktop = ["dep:gpui-kit", "dep:gpui-fps", "dep:smol"]
visual-check = ["desktop", "gpui-kit/test-support"]

[dependencies]
anyhow = "=1.0.102"
blake3 = "=1.8.3"
gpui-kit = { version = "=0.6.1", optional = true, default-features = false, features = ["profiler"] }
gpui-fps = { version = "=0.6.1", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
smol = { version = "=2.0.2", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "photo-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 1

[profile.release]
debug = 1
