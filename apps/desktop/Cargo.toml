[package]
name = "photo-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
desktop = ["dep:rune", "dep:rune-kit"]

[dependencies]
anyhow = "=1.0.102"
blake3 = "=1.8.3"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "=0.6.1"
photo-upload-client = { path = "../api/client" }
rune = { git = "https://github.com/anomalyco/rune", rev = "3e0cf8fe58d592cdda1ec5533461192edcfcdb47", optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3e0cf8fe58d592cdda1ec5533461192edcfcdb47", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
block = "=0.1.6"
cocoa = "=0.26.0"
objc = "=0.2.7"

[dev-dependencies]
tempfile = "=3.27.0"

[[bin]]
name = "photo-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 1

[profile.release]
debug = 1
